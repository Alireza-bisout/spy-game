name: make-keystore

# فقط یک‌بار اجرا کن. بعد فایل را دانلود کن و این workflow را دیگر نزن.
on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "رمز فایل keystore (یادداشت کن)"
        required: true
      key_password:
        description: "رمز کلید (می‌تواند همان رمز فایل باشد)"
        required: true
      alias:
        description: "نام alias"
        required: true
        default: spy

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate JKS
        env:
          STORE_PASS: ${{ inputs.store_password }}
          KEY_PASS: ${{ inputs.key_password }}
          ALIAS: ${{ inputs.alias }}
        run: |
          keytool -genkeypair -v \
            -keystore spy-release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Spy, OU=Spy, O=Spy, L=Tehran, ST=Tehran, C=IR"
          echo "KEYSTORE_B64<<EOF" >> "$GITHUB_STEP_SUMMARY"
          base64 -w0 spy-release.jks >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "EOF" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: spy-release-keystore
          path: spy-release.jks
          retention-days: 3
