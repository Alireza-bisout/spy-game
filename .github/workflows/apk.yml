name: apk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.19"

      - name: Install JS deps
        run: |
          rm -f package-lock.json
          bun install --network-concurrency=8

      - name: Next export
        run: bunx next build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Capacitor Android
        run: |
          bun add -d @capacitor/cli
          bun add @capacitor/core @capacitor/android @capacitor/app
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            bunx cap init "Spy" com.example.spy --web-dir out
          fi
          if [ ! -d android ]; then
            bunx cap add android
          fi
          pip install pillow -q
          python3 scripts/make-android-icons.py
          python3 scripts/apply-android-brand.py
          bunx cap sync android

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/spy-release.jks

      - name: Gradle signed release
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/spy-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Gradle debug (بدون کلید)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        with:
          name: spy-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        with:
          name: spy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
